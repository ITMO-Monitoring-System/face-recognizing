services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5572:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: pass

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  model-preload:
    image: ghcr.io/itmo-monitoring-system/face-recognizing:latest
    environment:
      NO_ALBUMENTATIONS_UPDATE: "1"
    command:
      [
        "python",
        "-c",
        "from insightface.app import FaceAnalysis; app=FaceAnalysis(allowed_modules=['detection','recognition']); app.prepare(ctx_id=-1, det_size=(640,640)); print('model ready')"
      ]
    volumes:
      - /opt/insightface:/root/.insightface
    working_dir: /app

  face-service:
    image: ghcr.io/itmo-monitoring-system/face-recognizing:latest
    depends_on:
      - rabbitmq
      - redis
    ports:
      - "8180:8180"
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      NO_ALBUMENTATIONS_UPDATE: "1"
    command: [ "python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8180", "--log-level", "debug" ]
    volumes:
      - /home/deploy/insightface:/root/.insightface
    working_dir: /app
