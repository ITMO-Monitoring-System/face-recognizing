name: Deploy Face Recognizing

on:
  push:
    branches: ["OneFace"]
  workflow_dispatch: {}

concurrency:
  group: deploy-face-recognizing-oneface
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.SSH_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.SSH_PORT }}
      DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME || secrets.SSH_USERNAME }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/site1/face-recognizing' }}
      APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
      APP_CONTAINER: face-recognizing_face-service_1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare runtime files
        run: |
          set -Eeuo pipefail
          if [ -n "${APP_ENV_FILE:-}" ]; then
            printf '%s\n' "${APP_ENV_FILE}" > .env.production
          else
            echo "APP_ENV_FILE is not set, keeping server-side .env.production"
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          set -Eeuo pipefail

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST (or SSH_HOST) secret}"
          : "${DEPLOY_USERNAME:?Missing DEPLOY_USERNAME (or SSH_USERNAME) secret}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          REMOTE="${DEPLOY_USERNAME}@${DEPLOY_HOST}"

          mkdir -p ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

          ssh -p "${DEPLOY_PORT}" "${REMOTE}" "mkdir -p ${DEPLOY_PATH}"

          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".codex" \
            --exclude "__pycache__" \
            --exclude ".pytest_cache" \
            --exclude ".venv" \
            --exclude ".env" \
            -e "ssh -p ${DEPLOY_PORT}" \
            ./ "${REMOTE}:${DEPLOY_PATH}/"

          echo "Building images and recreating containers..."
          ssh -p "${DEPLOY_PORT}" "${REMOTE}" "bash -l -c 'cd ${DEPLOY_PATH} && podman-compose --env-file .env.production -f docker-compose.prod.yml up -d --build --force-recreate'"

          echo "Removing dangling images to free disk space..."
          ssh -p "${DEPLOY_PORT}" "${REMOTE}" "bash -l -c 'podman image prune -f'"

          echo "Container status after deploy:"
          ssh -p "${DEPLOY_PORT}" "${REMOTE}" "bash -l -c 'podman ps'" || true

          echo "Verifying ${APP_CONTAINER} is running..."
          deploy_ok=
          for attempt in $(seq 1 18); do
            if ssh -p "${DEPLOY_PORT}" "${REMOTE}" "bash -l -c 'podman ps --filter name=${APP_CONTAINER} --filter status=running --quiet'" | grep -q .; then
              deploy_ok=1
              break
            fi
            echo "  ${APP_CONTAINER} not ready yet (${attempt}/18), waiting 5s..."
            sleep 5
          done
          if [ -z "${deploy_ok:-}" ]; then
            echo "::error::${APP_CONTAINER} is NOT running after deploy"
            ssh -p "${DEPLOY_PORT}" "${REMOTE}" "bash -l -c 'podman ps -a'" || true
            exit 1
          fi
          echo "${APP_CONTAINER} is running — deploy verified."
