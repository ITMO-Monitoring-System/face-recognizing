name: CI and image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q api.py download_model.py face_service logic

  image:
    name: Build and verify image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: itmo-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check runtime imports in the Linux image
        run: docker run --rm --entrypoint python itmo-ci:test -c 'import api; from face_service.core.retina_embending import ConfiguredFaceAnalysis'
        # Model downloads and full-stack checks belong to deployment acceptance.

  publish:
    name: Publish to GHCR
    needs: [checks, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'ITMO-Monitoring-System/face-recognizing'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked revision
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/itmo-monitoring-system/face-recognizing:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
      - name: Record release reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '### face-recognizing image\n\n`ghcr.io/itmo-monitoring-system/face-recognizing@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
