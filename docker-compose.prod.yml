services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_BIND_PORT:-15572}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_BIND_PORT:-25672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pass}
    networks:
      default:
        aliases:
          - recognizing-rabbitmq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_BIND_PORT:-16379}:6379"

  model-preload:
    build:
      context: .
    environment:
      FACE_ANALYSIS_CTX_ID: "-1"
      FACE_ANALYSIS_DET_SIZE: "640"
      NO_ALBUMENTATIONS_UPDATE: "1"
    working_dir: /app
    volumes:
      - ${INSIGHTFACE_PATH:-/opt/fizon/insightface}:/root/.insightface
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      python -c "import os;
      from insightface.app import FaceAnalysis;
      app=FaceAnalysis(allowed_modules=['detection','recognition']);
      det_size=int(os.getenv('FACE_ANALYSIS_DET_SIZE', '640'));
      ctx_id=int(os.getenv('FACE_ANALYSIS_CTX_ID', '-1'));
      app.prepare(ctx_id=ctx_id, det_size=(det_size, det_size));
      print('model ready')"
    restart: "no"

  face-service:
    build:
      context: .
    depends_on:
      - rabbitmq
      - redis
      - model-preload
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-18083}:8180"
    environment:
      FACE_RECOGNITION_THRESHOLD: "0.55"
      FACE_ANALYSIS_CTX_ID: "-1"
      FACE_ANALYSIS_DET_SIZE: "640"
      FACE_DIRECT_RECOGNITION: "1"
      OUT_AMQP_URL: amqp://${RABBITMQ_USER:-user}:${RABBITMQ_PASSWORD:-pass}@recognizing-rabbitmq:5672/
      OUT_QUEUE_PREFIX: ${OUT_QUEUE_PREFIX:-faces.recognition.out}

      BACKEND_URL: ${BACKEND_URL:-https://projctviscon.vps.webdock.cloud}
      BACKEND_START_PATH: ${BACKEND_START_PATH:-/api/service/lecture/start}
      BACKEND_STOP_PATH: ${BACKEND_STOP_PATH:-/api/service/lecture/stop}
      BACKEND_DATASET_PATH: ${BACKEND_DATASET_PATH:-/api/service/dataset}

      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      NO_ALBUMENTATIONS_UPDATE: "1"
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8180", "--log-level", "info"]
    volumes:
      - ${INSIGHTFACE_PATH:-/opt/fizon/insightface}:/root/.insightface
    working_dir: /app
    networks:
      - default
      - face_tracking

networks:
  default: {}
  face_tracking:
    external: true
    name: face-tracking_default
